<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>GymPass</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0a0a;color:#f5f5f5;font-family:system-ui,sans-serif;padding:24px}
  .card{width:100%;max-width:420px;background:#161616;border:1px solid #2a2a2a;border-radius:20px;padding:28px}
  h1{margin:0 0 6px;font-size:28px;color:#d4af37}
  p{margin:0 0 20px;color:#a3a3a3;font-size:14px;line-height:1.5}
  input{width:100%;padding:14px;border-radius:12px;border:1px solid #333;background:#0f0f0f;color:#fff;font-size:16px;margin-bottom:12px}
  button{width:100%;padding:14px;border:0;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:10px}
  .go{background:#d4af37;color:#111}
  .alt{background:#262626;color:#ddd}
  small{color:#777;display:block;text-align:center;margin-top:6px}
</style>
</head>
<body>
<div class="card">
  <h1>GymPass</h1>
  <p>Enter the address of your GymPass server (the https link from your tunnel or hosting). It is remembered on this phone.</p>
  <input id="url" type="url" inputmode="url" autocapitalize="off" autocorrect="off" placeholder="https://xxxx.lhr.life">
  <button class="go" id="open">Open GymPass</button>
  <button class="alt" id="clear">Clear saved address</button>
  <small id="msg"></small>
</div>
<script>
  var KEY = "gympass_server_url";
  var input = document.getElementById("url");
  var msg = document.getElementById("msg");
  function load(){ try { return localStorage.getItem(KEY) || ""; } catch(e){ return ""; } }
  function save(v){ try { localStorage.setItem(KEY, v); } catch(e){} }
  function normalize(v){
    v = (v || "").trim();
    if(!v) return "";
    if(!/^https?:\/\//i.test(v)) v = "https://" + v;
    return v.replace(/\/+$/, "");
  }
  input.value = load();
  document.getElementById("open").onclick = function(){
    var v = normalize(input.value);
    if(!v){ msg.textContent = "Please enter the server address."; return; }
    save(v);
    window.location.href = v;
  };
  document.getElementById("clear").onclick = function(){
    save(""); input.value = ""; msg.textContent = "Cleared.";
  };
</script>
</body>
</html>
