# Postgres only (for local development with `go run` / `npm run dev`):
#   docker compose up -d postgres
#
# Whole app in containers:
#   1. copy backend/.env.example to backend/.env and fill it in (DEV_MODE=false for real use)
#   2. put the NEXT_PUBLIC_* values in a root .env file (see DEPLOY.md)
#   3. docker compose up -d --build
version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gympass-postgres
    environment:
      POSTGRES_DB: gympass_db
      POSTGRES_USER: gympass_user
      POSTGRES_PASSWORD: gympass_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: gympass-backend
    env_file: ./backend/.env
    environment:
      DB_DRIVER: postgres
      DATABASE_URL: host=postgres port=5432 user=gympass_user password=gympass_password dbname=gympass_db sslmode=disable
      UPLOAD_DIR: /app/uploads
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
    container_name: gympass-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  uploads_data:
