version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gympass-postgres
    environment:
      POSTGRES_DB: gympass_db
      POSTGRES_USER: gympass_user
      POSTGRES_PASSWORD: gympass_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
