name: Build Android APK

on:
  workflow_dispatch:
    push:
      branches: [gym-marketplace]
      paths:
        - "mobile/**"
        - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        working-directory: mobile
        run: npm install

      - name: Generate Android project
        working-directory: mobile
        run: |
          npx cap add android
          npx cap sync android

      - name: Allow location (for nearest gyms)
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n</manifest>#' mobile/android/app/src/main/AndroidManifest.xml
          grep -n "uses-permission" mobile/android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-beta-${{ github.run_number }}
          name: GymPass Android beta ${{ github.run_number }}
          prerelease: true
          files: mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Also keep as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GymPass-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
